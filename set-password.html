<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Set a new password · B Money Bets</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
  <link rel="apple-touch-icon" href="brand/apple-touch.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Geist+Mono:wght@400;500;600&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=auth0928">
</head>
<body class="is-recovery">
  <div class="grain" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>

  <div class="auth-gate">
    <div class="auth-card">
      <img class="auth-bee" src="brand/bee-256.png" width="240" height="160" alt="">
      <div class="auth-panel">
        <p class="eyebrow">The desk</p>
        <h1>New password</h1>
        <p class="lede" id="pw-lead">Choose a password for this login. You’ll go straight to the desk.</p>
        <form id="pw-form" hidden>
          <label class="field">
            <span>New password</span>
            <input id="pw-new" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">
            <span>Again</span>
            <input id="pw-again" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <p class="auth-error" id="pw-error" role="alert" hidden></p>
          <p class="auth-ok" id="pw-ok" role="status" hidden></p>
          <button type="submit" class="btn btn-fill auth-submit" id="pw-submit">Save password</button>
        </form>
        <a class="auth-link" href="./">Back to sign in</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = "https://zajfiyviybclkrqyohdt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vP-xB4iF8WTWcJkDMm9A2w_koy7GSVX";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });

    const form = document.getElementById("pw-form");
    const lead = document.getElementById("pw-lead");
    let ready = false;

    function show(id, msg) {
      const el = document.getElementById(id);
      el.hidden = !msg;
      el.textContent = msg || "";
    }

    function markReady() {
      ready = true;
      form.hidden = false;
      if (lead) lead.textContent = "Choose a password for this login. You’ll go straight to the desk.";
    }

    function markWaiting(msg) {
      ready = false;
      form.hidden = true;
      if (lead) lead.textContent = msg;
    }

    client.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" || (session && new URLSearchParams(location.hash.replace(/^#/, "")).get("type") === "recovery")) {
        markReady();
      }
    });

    (async function init() {
      const params = new URLSearchParams(location.search);
      const code = params.get("code");
      if (code) {
        const { error } = await client.auth.exchangeCodeForSession(code);
        if (error) {
          markWaiting("That reset link is no good. Request a new one from the sign-in screen.");
          show("pw-error", error.message || "Reset link expired.");
          return;
        }
        markReady();
        return;
      }
      const { data } = await client.auth.getSession();
      const type = new URLSearchParams(location.hash.replace(/^#/, "")).get("type");
      if (data.session && (type === "recovery" || ready)) markReady();
      else if (!data.session) markWaiting("Open the reset link from your email on this phone or computer. Then set the password here.");
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = document.getElementById("pw-new").value;
      const again = document.getElementById("pw-again").value;
      const btn = document.getElementById("pw-submit");
      show("pw-error", "");
      show("pw-ok", "");
      if (pw.length < 8) {
        show("pw-error", "Use at least 8 characters.");
        return;
      }
      if (pw !== again) {
        show("pw-error", "Those passwords don’t match.");
        return;
      }
      const { data } = await client.auth.getSession();
      if (!ready && !(data && data.session)) {
        show("pw-error", "Open the reset link from your email first.");
        return;
      }
      btn.disabled = true;
      const { error } = await client.auth.updateUser({ password: pw });
      btn.disabled = false;
      if (error) {
        show("pw-error", error.message || "Could not save that password.");
        return;
      }
      show("pw-ok", "Password saved. Opening the desk.");
      window.setTimeout(() => { window.location.replace("./"); }, 700);
    });
  </script>
</body>
</html>
